[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dsmc-0d-v2"
version = "2.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2", "pyyaml>=6", "coll-models-v2==2.1.0", "dsmc-v2-contracts==2.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
