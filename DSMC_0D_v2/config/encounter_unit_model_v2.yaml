# Encounter-unit closure model v2: alpha-refined grid (0.05 planes), no invariant response.
#
# One DSMC event is one CTC encounter:
#   - clock      sigma(theta, AR) measured from this project's CTC shards,
#                (2 b_max)^2 N_hit/N_att (encounter_cross_section.json in the model
#                folder); theta is the cell's instantaneous T_tr/T_rot
#   - loss       BL Beta draw rescaled to the CTC per-encounter mean loss that the
#                energy kernel was fitted with (fitted_mean_loss in the artifact),
#                times s(z) = E[eps|z]/E[eps] with E[eps|z] = c_t z + c_r (1 - z)
#                (loss_memory.json in the model folder): the loss follows the
#                pair's incoming energy split
#   - angle      energy-tilted angular law with incoming-partition memory
#                (angular_memory.json in the model folder, one row per artifact node)
# Nodes: alpha 0.50-0.95 in 0.05 steps plus 1.0. On a node its tables are used
# as fitted; between nodes (e.g. alpha = 0.99) the laws are mixed on the stencil.
# The invariant (flow-moment) response is retired. Built by hpc/submit_alpha_refinement.sh
# (TAG=alpha_v1_20261001): the artifact and both tables live in one model folder.
# The v1 model was validated for USF at AR 1.5-3, alpha 0.50-0.95
# (usf-encounter-v1) and for HCS at the DEM benchmark nodes.  See
# reports/USF_ENCOUNTER_UNIT_2026-09-29.md.
schema_version: "2.2.0"

particle:
  AR: 2.0
  radius: 0.5
  mass: 1.0

system:
  kTt: 1.0
  kTr: 1.0
  alpha: 0.8
  eta: 1.0
  phi: 0.001
  domain: [50.0, 50.0, 50.0]
  C_alpha: 1.0

time:
  dt: 0.01
  dtau: 0.1
  t_end: 10.0
  tau_end: null
  equilibration_time: 0.0

flow:
  mode: hcs
  shear_rate: 0.0

simulation:
  seeds: [42]
  output_dir: results/
  sphere_collision: false
  use_isotropic_eps: true
  orientation_integrator: symmetric_midpoint_v1

preprocessing:
  model_root: DSMC_0D_v2/models
  dissipation:
    beta_a: 1.21
    beta_b: 3.67

microscopic_closure:
  routing: variational_v2
  angular: variational_v2
  artifact: models/microscopic_closure_v2_alpha_v1_20261001/closure_v2.npz
  state_update_cpp: 0.05
  event_unit: encounter
  encounter_cross_section: models/microscopic_closure_v2_alpha_v1_20261001/encounter_cross_section.json
  angular_memory: models/microscopic_closure_v2_alpha_v1_20261001/angular_memory.json
  loss_memory: models/microscopic_closure_v2_alpha_v1_20261001/loss_memory.json
