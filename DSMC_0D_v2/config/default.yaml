schema_version: "2.2.0"

particle:
  AR: 2.0
  radius: 0.5
  mass: 1.0

system:
  kTt: 1.0
  kTr: 1.0
  alpha: 0.8
  eta: 1.0
  phi: 0.001
  domain: [50.0, 50.0, 50.0]
  C_alpha: 1.0  # used only when routing=legacy_rank0

time:
  dt: 0.01
  dtau: 0.1
  t_end: 10.0
  tau_end: null
  equilibration_time: 0.0

flow:
  mode: hcs
  shear_rate: 0.0

simulation:
  seeds: [42]
  output_dir: results/
  sphere_collision: false
  use_isotropic_eps: true

preprocessing:
  model_root: DSMC_0D_v2/models
  dissipation:
    beta_a: 1.21
    beta_b: 3.67

microscopic_closure:
  # The released model (tag closure-v2-final-v1).  One DSMC event is one CTC
  # encounter; the artifact runs only with the three tables beside it
  # (models/microscopic_closure_v2_final_v1/model_card.json).  Spheres
  # (simulation.sphere_collision) and alpha = 1 use exact blocks and never
  # query it.
  routing: variational_v2
  angular: variational_v2
  artifact: models/microscopic_closure_v2_final_v1/closure_v2.npz
  state_update_cpp: 0.05
  event_unit: encounter
  encounter_cross_section: models/microscopic_closure_v2_final_v1/encounter_cross_section.json
  angular_memory: models/microscopic_closure_v2_final_v1/angular_memory.json
  loss_memory: models/microscopic_closure_v2_final_v1/loss_memory.json
